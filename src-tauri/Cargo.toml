[package]
name = "lexiflow"
version = "0.2.5"
description = "LexiFlow — local-first English vocabulary trainer"
authors = ["LexiFlow contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lexiflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"
# Wordbook importing: spreadsheets and PDFs are parsed in the backend so the
# frontend only ever receives rows.
calamine = "0.37"
pdf-extract = "0.7"
# The FSRS scheduler itself lives in the frontend (src/lib/fsrs.ts) so that
# there is exactly one implementation of the algorithm, and it can be tested
# without a database. The backend only stores the resulting card.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
